[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "montana-public-data-lab"
version = "0.1.0"
description = "Learning sandbox for public APIs, ETL, SQL, QA, and dashboards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11,<4",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[project.scripts]
montana-data-lab = "montana_data_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/montana_data_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
